name: Validate project
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scientific dependencies
        run: pip install -r requirements-lock.txt
      - name: Test statistical methods
        run: python -m unittest discover -s tests -v
      - name: Validate saved results and website downloads
        run: python scripts/validate_project.py
      - name: Validate exploratory supplementary analyses
        run: python scripts/validate_supplement.py
